<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Intuvora</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b4bff'/%3E%3Crect x='8' y='13' width='3' height='6' rx='1.5' fill='white'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5' fill='white'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5' fill='white'/%3E%3Crect x='23' y='14' width='3' height='4' rx='1.5' fill='%2319c6a7'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header scrolled">
  <div class="container nav">
    <a class="brand" href="/" aria-label="Intuvora home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b4bff"/><rect x="8" y="13" width="3" height="6" rx="1.5" fill="#fff"/><rect x="13" y="9" width="3" height="14" rx="1.5" fill="#fff"/><rect x="18" y="11" width="3" height="10" rx="1.5" fill="#fff"/><rect x="23" y="14" width="3" height="4" rx="1.5" fill="#19c6a7"/></svg>
      intuvora
    </a>
    <a class="link-btn" href="/">Back to home</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1 id="title">Welcome back</h1>
    <p id="subtitle">Log in to run your AI sales campaigns.</p>
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="active" role="tab">Log in</button>
      <button type="button" id="tab-signup" role="tab">Create account</button>
    </div>
    <form id="form">
      <div id="name-field" hidden>
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="100" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8" autocomplete="current-password">
      <p class="hint" id="pw-hint" hidden>At least 8 characters.</p>
      <button type="submit" id="submit">Log in</button>
      <div class="msg" id="formmsg"></div>
    </form>
    <p class="auth-note">Pay as you go: ₹<span id="rate">10</span> per minute of answered calls. Top up any time.</p>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const asked = params.get('next') || '';
const next = /^\/(?![\/\\])/.test(asked) ? asked : '/dashboard';  // same-site paths only
let mode = 'login';

function setMode(m) {
  mode = m;
  const signup = m === 'signup';
  $('tab-login').classList.toggle('active', !signup);
  $('tab-signup').classList.toggle('active', signup);
  $('name-field').hidden = !signup;
  $('pw-hint').hidden = !signup;
  $('title').textContent = signup ? 'Create your account' : 'Welcome back';
  $('subtitle').textContent = signup ? 'Start calling your leads in a few minutes.' : 'Log in to run your AI sales campaigns.';
  $('submit').textContent = signup ? 'Create account' : 'Log in';
  $('password').autocomplete = signup ? 'new-password' : 'current-password';
  $('formmsg').textContent = '';
}
$('tab-login').onclick = () => setMode('login');
$('tab-signup').onclick = () => setMode('signup');
setMode(params.get('mode') === 'signup' ? 'signup' : 'login');

fetch('/api/config').then(r => r.json()).then(c => { $('rate').textContent = c.price_per_minute_paise / 100; }).catch(() => {});
fetch('/api/me').then(r => { if (r.ok) location.href = next; });  // already logged in

$('form').onsubmit = async (e) => {
  e.preventDefault();
  $('submit').disabled = true;
  const body = {email: $('email').value.trim(), password: $('password').value};
  if (mode === 'signup') body.name = $('name').value.trim();
  try {
    const res = await fetch(`/api/auth/${mode}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (res.ok) { location.href = next; return; }
    const d = await res.json().catch(() => ({}));
    $('formmsg').textContent = typeof d.detail === 'string' ? d.detail : 'Please check your details and try again.';
    $('formmsg').className = 'msg error';
  } finally { $('submit').disabled = false; }
};
</script>
</body>
</html>
