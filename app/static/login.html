<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Intuvora</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header scrolled">
  <div class="container nav">
    <a class="brand" href="/" aria-label="Intuvora home">
      <span class="brand-mark"><img src="/static/logo-mark.png" alt=""></span>
      intuvora
    </a>
    <a class="link-btn" href="/">Back to home</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card" style="text-align:center">
    <h1>Welcome to Intuvora</h1>
    <p>Sign in or create your account with Google. No password to remember.</p>
    <div id="google-button" class="google-button"></div>
    <div class="msg" id="formmsg"></div>
    <p class="auth-note">New here? Continuing with Google creates your account. Pay as you go: ₹<span id="rate">10</span>
      per minute of answered calls.</p>
  </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $ = (id) => document.getElementById(id);
const asked = new URLSearchParams(location.search).get('next') || '';
const next = /^\/(?![\/\\])/.test(asked) ? asked : '/dashboard';  // same-site paths only

function showError(text) { $('formmsg').textContent = text; $('formmsg').className = 'msg error'; }

async function onGoogleCredential(response) {
  const res = await fetch('/api/auth/google', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                               body: JSON.stringify({credential: response.credential})});
  if (res.ok) { location.href = next; return; }
  const d = await res.json().catch(() => ({}));
  showError(typeof d.detail === 'string' ? d.detail : 'Google sign-in failed. Please try again.');
}

function startGoogle(clientId, tries = 0) {
  if (!window.google || !google.accounts) {  // the Google script loads asynchronously
    if (tries > 50) return showError('Could not load Google sign-in. Check your connection and reload the page.');
    return setTimeout(() => startGoogle(clientId, tries + 1), 100);
  }
  google.accounts.id.initialize({client_id: clientId, callback: onGoogleCredential, ux_mode: 'popup'});
  google.accounts.id.renderButton($('google-button'), {theme: 'outline', size: 'large', shape: 'pill',
                                                       text: 'continue_with', width: 300});
}

fetch('/api/me').then(r => { if (r.ok) location.href = next; });  // already signed in
fetch('/api/config').then(r => r.json()).then(c => {
  $('rate').textContent = c.price_per_minute_paise / 100;
  if (!c.google_client_id) return showError('Google sign-in is not configured yet (GOOGLE_CLIENT_ID).');
  startGoogle(c.google_client_id);
}).catch(() => showError('Could not load sign-in. Please reload the page.'));
</script>
</body>
</html>
