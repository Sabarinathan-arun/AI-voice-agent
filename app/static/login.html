<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Intuvora</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header scrolled">
  <div class="container nav">
    <a class="brand" href="/" aria-label="Intuvora home">
      <span class="brand-mark"><img src="/static/logo-mark.png" alt=""></span>
      intuvora
    </a>
    <a class="link-btn" href="/">Back to home</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <!-- Sign in / create account -->
    <div id="view-main">
      <h1 id="title">Welcome back</h1>
      <p id="subtitle">Sign in to run your AI sales campaigns.</p>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-signin" class="active" role="tab">Sign in</button>
        <button type="button" id="tab-signup" role="tab">Create account</button>
      </div>
      <form id="form">
        <div id="name-field" hidden>
          <label for="name">Your name</label>
          <input type="text" id="name" maxlength="100" autocomplete="name">
        </div>
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="current-password">
        <div class="auth-row">
          <span class="hint" id="pw-hint" hidden>At least 8 characters.</span>
          <button type="button" class="link-btn" id="show-forgot">Forgot password?</button>
        </div>
        <button type="submit" id="submit">Sign in</button>
      </form>
      <div class="divider"><span>or</span></div>
      <button type="button" class="google-btn" id="google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>
      <div class="msg" id="msg"></div>
    </div>

    <!-- Forgot password -->
    <div id="view-forgot" hidden>
      <h1>Reset your password</h1>
      <p>Enter your email and we'll send you a link to set a new password.</p>
      <form id="forgot-form">
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" required autocomplete="email">
        <button type="submit" id="forgot-submit">Send reset link</button>
      </form>
      <div class="msg" id="forgot-msg"></div>
      <p class="auth-note"><button type="button" class="link-btn" id="back-to-signin">Back to sign in</button></p>
    </div>

    <p class="auth-note">Pay as you go: ₹<span id="rate">10</span> per minute of answered calls. Unanswered calls are free.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/static/auth.js"></script>
<script>
let mode = 'signin', sb = null;

function setMode(m) {
  mode = m;
  const signup = m === 'signup';
  $('tab-signin').classList.toggle('active', !signup);
  $('tab-signup').classList.toggle('active', signup);
  $('name-field').hidden = !signup;
  $('pw-hint').hidden = !signup;
  $('show-forgot').hidden = signup;
  $('title').textContent = signup ? 'Create your account' : 'Welcome back';
  $('subtitle').textContent = signup ? 'Start calling your leads in a few minutes.' : 'Sign in to run your AI sales campaigns.';
  $('submit').textContent = signup ? 'Create account' : 'Sign in';
  $('password').autocomplete = signup ? 'new-password' : 'current-password';
  $('msg').textContent = '';
}
function showView(forgot) {
  $('view-main').hidden = forgot;
  $('view-forgot').hidden = !forgot;
  if (forgot) $('forgot-email').value = $('email').value;
}
$('tab-signin').onclick = () => setMode('signin');
$('tab-signup').onclick = () => setMode('signup');
$('show-forgot').onclick = () => showView(true);
$('back-to-signin').onclick = () => showView(false);
setMode(new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'signin');

$('form').onsubmit = async (e) => {
  e.preventDefault();
  if (!sb) return;
  const email = $('email').value.trim(), password = $('password').value;
  $('submit').disabled = true;
  try {
    if (mode === 'signup') {
      const {data, error} = await sb.auth.signUp({email, password, options: {
        data: {full_name: $('name').value.trim()}, emailRedirectTo: `${location.origin}/login`}});
      if (error) return show('msg', error.message);
      if (data.session) return finishSignIn(sb, data.session, 'msg');  // email confirmation switched off
      show('msg', `Almost done! We sent a confirmation link to ${email}. Open it to activate your account.`, true);
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if (error) {
        if (/confirm/i.test(error.message)) {
          await sb.auth.resend({type: 'signup', email, options: {emailRedirectTo: `${location.origin}/login`}});
          return show('msg', 'Please confirm your email first. We just sent you a new confirmation link.');
        }
        return show('msg', /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message);
      }
      await finishSignIn(sb, data.session, 'msg');
    }
  } finally { $('submit').disabled = false; }
};

$('forgot-form').onsubmit = async (e) => {
  e.preventDefault();
  if (!sb) return;
  $('forgot-submit').disabled = true;
  const email = $('forgot-email').value.trim();
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: `${location.origin}/reset-password`});
  $('forgot-submit').disabled = false;
  if (error) return show('forgot-msg', error.message);
  show('forgot-msg', `If an account exists for ${email}, a reset link is on its way. Check your inbox.`, true);
};

$('google').onclick = async () => {
  if (!sb) return;
  if (asked) sessionStorage.setItem('intuvora_next', asked);  // remember where to go after Google
  const {error} = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: `${location.origin}/login`}});
  if (error) show('msg', error.message);
};

(async () => {
  fetch('/api/me').then(r => { if (r.ok) location.href = nextPage; });  // already signed in
  try {
    const {client, cfg} = await supabaseClient();
    sb = client;
    $('rate').textContent = cfg.price_per_minute_paise / 100;
  } catch (e) { return show('msg', e.message); }
  const err = linkError();
  if (err) show('msg', `${err}. Please try again.`);
  // Back from Google or from an email confirmation link: Supabase signs in from the address, then we finish.
  sb.auth.onAuthStateChange((event, session) => { if (session) finishSignIn(sb, session, 'msg'); });
})();
</script>
</body>
</html>
