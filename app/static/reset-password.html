<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password · Intuvora</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header scrolled">
  <div class="container nav">
    <a class="brand" href="/" aria-label="Intuvora home">
      <span class="brand-mark"><img src="/static/logo-mark.png" alt=""></span>
      intuvora
    </a>
    <a class="link-btn" href="/login">Sign in</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p id="intro">Checking your reset link…</p>
    <form id="form" hidden>
      <label for="password">New password</label>
      <input type="password" id="password" required minlength="8" autocomplete="new-password">
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" required minlength="8" autocomplete="new-password">
      <p class="hint">At least 8 characters.</p>
      <button type="submit" id="submit">Save password and sign in</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/static/auth.js"></script>
<script>
let sb = null, recovery = null;

function ready(session) {
  recovery = session;
  $('intro').textContent = 'Choose a new password for your Intuvora account.';
  $('form').hidden = false;
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  if ($('password').value !== $('confirm').value) return show('msg', 'The two passwords do not match.');
  $('submit').disabled = true;
  const {data, error} = await sb.auth.updateUser({password: $('password').value});
  $('submit').disabled = false;
  if (error) return show('msg', error.message);
  show('msg', 'Password updated. Signing you in…', true);
  const {data: s} = await sb.auth.getSession();
  await finishSignIn(sb, s.session || recovery, 'msg');
};

(async () => {
  try { sb = (await supabaseClient()).client; } catch (e) { return show('msg', e.message); }
  const err = linkError();
  if (err) {
    $('intro').innerHTML = 'This reset link has expired or was already used. <a href="/login">Request a new one</a>.';
    return;
  }
  sb.auth.onAuthStateChange((event, session) => { if (session) ready(session); });
  const {data} = await sb.auth.getSession();
  if (data.session) ready(data.session);
  setTimeout(() => {
    if (!recovery) $('intro').innerHTML = 'Open this page from the reset link in your email. <a href="/login">Request a new link</a>.';
  }, 4000);
})();
</script>
</body>
</html>
